name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # fetch-vendor.js берёт последние релизы AmneziaWG и wgcf; токен снимает лимит GitHub API.
          # Своё имя переменной: увидев GITHUB_TOKEN, electron-builder начал бы сам публиковать релиз
          SKVOZ_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Skvoz-Setup-*.exe
            release/Skvoz-*-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
